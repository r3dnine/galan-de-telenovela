<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#150E2E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="Learn Spanish by talking to the locals of Latin America in this interactive telenovela game.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Galán de Telenovela</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&family=Rozha+One&display=swap">
<style>
/* LAYOUT: portrait phone game. Each screen fills the height. Scene = art stage on top, dialogue scrolls in the middle, action dock pinned at the bottom. Telenovela-poster glamour: night indigo, marigold, rose. */
:root{
  --bg:#150E2E; --bg2:#1D1440; --panel:#2A1D58; --panel2:#392872;
  --ink:#F7EFDF; --ink2:#C2B8E2; --line:rgba(255,255,255,.16);
  --gold:#FFB62E; --gold-ink:#2B1A00; --rose:#E83A74; --rose-ink:#FFFFFF;
  --teal:#2FD3B4; --teal-ink:#06302A; --bad:#FF7A6B; --warn:#FFC857;
  --good-bg:rgba(47,211,180,.16); --ok-bg:rgba(255,200,87,.16); --bad-bg:rgba(255,122,107,.16);
  --shadow:0 10px 28px rgba(0,0,0,.4); --scrim:rgba(10,5,30,.58);
  --font-display:'Rozha One',Georgia,'Times New Roman',serif;
  --font-body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;
  --gl:max(16px,env(safe-area-inset-left,0px)); --gr:max(16px,env(safe-area-inset-right,0px));
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#F5EEFA; --bg2:#ECE2F6; --panel:#FFFFFF; --panel2:#F1E7FB;
    --ink:#241440; --ink2:#5F5080; --line:rgba(36,20,64,.18);
    --gold:#E59A00; --gold-ink:#241400; --rose:#C8205F; --rose-ink:#FFFFFF;
    --teal:#0C8E79; --teal-ink:#FFFFFF; --bad:#CC3B2B; --warn:#8F5E00;
    --good-bg:rgba(12,142,121,.12); --ok-bg:rgba(143,94,0,.12); --bad-bg:rgba(204,59,43,.12);
    --shadow:0 10px 24px rgba(70,35,120,.18);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#F5EEFA; --bg2:#ECE2F6; --panel:#FFFFFF; --panel2:#F1E7FB;
  --ink:#241440; --ink2:#5F5080; --line:rgba(36,20,64,.18);
  --gold:#E59A00; --gold-ink:#241400; --rose:#C8205F; --rose-ink:#FFFFFF;
  --teal:#0C8E79; --teal-ink:#FFFFFF; --bad:#CC3B2B; --warn:#8F5E00;
  --good-bg:rgba(12,142,121,.12); --ok-bg:rgba(143,94,0,.12); --bad-bg:rgba(204,59,43,.12);
  --shadow:0 10px 24px rgba(70,35,120,.18);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#150E2E; --bg2:#1D1440; --panel:#2A1D58; --panel2:#392872;
  --ink:#F7EFDF; --ink2:#C2B8E2; --line:rgba(255,255,255,.16);
  --gold:#FFB62E; --gold-ink:#2B1A00; --rose:#E83A74; --rose-ink:#FFFFFF;
  --teal:#2FD3B4; --teal-ink:#06302A; --bad:#FF7A6B; --warn:#FFC857;
  --good-bg:rgba(47,211,180,.16); --ok-bg:rgba(255,200,87,.16); --bad-bg:rgba(255,122,107,.16);
  --shadow:0 10px 28px rgba(0,0,0,.4);
  color-scheme:dark;
}

html{box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--font-body);overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation}
button[disabled]{cursor:default}
input,select{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.ic{width:1.25em;height:1.25em;flex:none;vertical-align:middle}

#app{position:relative;height:100%;max-width:560px;margin:0 auto;overflow:hidden}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--bg);animation:fadeIn .28s ease both}
.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-block:12px 24px;-webkit-overflow-scrolling:touch}
.bleed{margin-left:calc(var(--gl)*-1);margin-right:calc(var(--gr)*-1)}

/* buttons */
.btn{min-height:54px;padding:0 20px;border-radius:16px;font-weight:800;font-size:18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;flex:1;background:var(--panel2);border:1px solid var(--line);transition:transform .12s}
.btn:active:not([disabled]){transform:scale(.97)}
.btn.primary{background:var(--rose);color:var(--rose-ink);border-color:transparent}
.btn.gold{background:var(--gold);color:var(--gold-ink);border-color:transparent}
.btn.ghost{background:transparent}
.btn.sm{min-height:46px;font-size:16px;flex:none;padding:0 16px;border-radius:14px}
.btn[disabled]{opacity:.45}
.icon-btn{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--scrim);color:#fff;flex:none}
.link{color:var(--gold);font-weight:700;text-decoration:underline;text-underline-offset:3px;min-height:44px;padding:0 6px}

/* header + nav */
.hdr{flex:none;display:flex;align-items:center;gap:12px;padding-block:12px 8px}
.hdr .back{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line);flex:none}
.hdr-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.hdr-t b{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-t span{font-size:13px;color:var(--ink2)}
.avatar{width:56px;height:56px;border-radius:50%;overflow:hidden;flex:none;background:linear-gradient(160deg,var(--panel2),var(--panel));border:2px solid var(--gold)}
.avatar svg{width:100%;height:100%;display:block}
.xpbar{height:6px;border-radius:9px;background:var(--panel);overflow:hidden;margin-top:3px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--rose),var(--gold));border-radius:9px}
.streak{display:flex;align-items:center;gap:4px;padding:6px 12px;border-radius:99px;background:var(--panel);border:1px solid var(--line);color:var(--gold);font-weight:800}
.nav{flex:none;display:flex;gap:2px;padding-block:6px 8px;margin-left:calc(var(--gl)*-1);margin-right:calc(var(--gr)*-1);padding-left:var(--gl);padding-right:var(--gr);background:var(--bg2);border-top:1px solid var(--line)}
.nav-b{position:relative;flex:1;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:14px;color:var(--ink2);font-size:12px;font-weight:700}
.nav-b .ic{width:24px;height:24px}
.nav-b.on{color:var(--gold);background:var(--panel)}
.badge{position:absolute;top:4px;right:calc(50% - 26px);min-width:20px;height:20px;padding:0 5px;border-radius:99px;background:var(--rose);color:#fff;font-size:12px;font-style:normal;font-weight:800;display:grid;place-items:center}

/* typography */
.kicker{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.h-big{font-family:var(--font-display);font-size:34px;line-height:1.1;font-weight:400;text-wrap:balance}
.h-sec{font-family:var(--font-display);font-size:26px;font-weight:400;line-height:1.15;margin-bottom:12px;text-wrap:balance}
.lead{color:var(--ink2);font-size:17px}
.note{padding:12px 14px;border-radius:16px;background:var(--panel);border:1px solid var(--line)}
.note b{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin-bottom:2px}
.note p{font-size:15px}

/* splash */
.splash{padding:0;background:var(--bg)}
.splash .poster{position:absolute;inset:0}
.poster .bd,.poster .bd svg{width:100%;height:100%;display:block}
.poster-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(21,14,46,.2) 0%,rgba(21,14,46,.55) 45%,rgba(21,14,46,.95) 100%)}
.splash-in{position:relative;flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:14px;
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-bottom:24px;color:#F7EFDF}
.logo{font-family:var(--font-display);font-weight:400;font-size:clamp(46px,14vw,70px);line-height:.98;color:#FFE9B0;text-shadow:0 4px 22px rgba(232,58,116,.65);text-wrap:balance}
.splash .kicker{color:#FFB62E}
.tagline{font-size:20px;font-weight:600;color:#F7EFDF}
.duo{position:relative;height:clamp(150px,30vh,260px);margin-bottom:-6px}
.duo .a,.duo .b{position:absolute;bottom:0;height:100%}
.duo svg{height:100%;width:auto;display:block}
.duo .a{left:6%;transform:scaleX(-1)}
.duo .b{right:6%}
.splash .fine{font-size:13px;color:#C2B8E2;text-align:center}
.splash .btn.primary{flex:none;width:100%}

/* map */
.road{display:flex;flex-direction:column;gap:16px}
.ep{display:flex;flex-direction:column;border-radius:20px;overflow:hidden;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow)}
.ep-art{position:relative;height:112px;width:100%;overflow:hidden;display:block;text-align:left}
.ep-art .bd,.ep-art .bd svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.ep-face{position:absolute;right:14px;bottom:0;height:104px}
.ep-face svg{height:100%;width:auto;display:block}
.ep.locked .ep-art{filter:saturate(.25) brightness(.6)}
.lock{position:absolute;left:14px;top:14px;width:44px;height:44px;border-radius:50%;background:var(--scrim);color:#fff;display:grid;place-items:center}
.ep-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:3px}
.ep-n{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.ep-body h3{font-family:var(--font-display);font-weight:400;font-size:26px;line-height:1.1}
.ep-body p{color:var(--ink2);font-size:15px}
.ep-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;flex-wrap:wrap}
.ep-hearts{display:flex;gap:4px;color:var(--line)}
.ep-hearts .hh{display:inline-flex;font-size:24px;color:var(--ink2);opacity:.55}
.ep-hearts .hh.on{color:var(--rose);opacity:1}
.ep-btns{display:flex;gap:8px}
.ep-lock-note{font-size:14px;color:var(--ink2)}

/* prep */
.prep-art{position:relative;height:150px;overflow:hidden;border-radius:22px}
.prep-art .bd,.prep-art .bd svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.prep-art .her-mini{position:absolute;right:8%;bottom:0;height:132px}
.prep-art .her-mini svg{height:100%;width:auto;display:block}
.stack{display:flex;flex-direction:column;gap:14px}
.fc-count{font-size:13px;font-weight:800;letter-spacing:.1em;color:var(--ink2);text-align:center}
.fcard{padding:22px 18px;border-radius:24px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
.fc-es{font-family:var(--font-display);font-size:32px;line-height:1.15;text-wrap:balance}
.fc-pron{font-size:18px;font-style:italic;color:var(--gold);font-weight:600}
.fc-tools{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.fc-back{width:100%;padding-top:14px;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:8px}
.fc-en{font-size:22px;font-weight:800}
.fc-note{font-size:15px;color:var(--ink2)}
.dots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--gold)}
.wordlist{display:flex;flex-direction:column;gap:6px;text-align:left;width:100%}
.wordlist div{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.wordlist b{font-weight:700}
.wordlist span{color:var(--ink2);text-align:right}

/* scene */
.scene{padding-bottom:0}
.stage{position:relative;flex:none;height:clamp(200px,35%,330px);margin-left:calc(var(--gl)*-1);margin-right:calc(var(--gr)*-1);overflow:hidden;border-bottom:1px solid var(--line);background:#150E2E}
.stage .bd,.stage .bd svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.portrait{position:absolute;bottom:0;pointer-events:none}
.portrait svg{display:block;height:100%;width:auto}
.her-p{right:5%;height:95%;animation:bob 3.8s ease-in-out infinite}
.hero-p{left:1%;height:64%;transform:scaleX(-1)}
.hud{position:absolute;top:10px;left:var(--gl);right:var(--gr);display:flex;align-items:center;gap:10px}
.charm{flex:1;display:flex;align-items:center;gap:8px;background:var(--scrim);color:#fff;padding:0 12px;height:46px;border-radius:99px}
.charm-ic{color:#FF6FA0;display:inline-flex}
.charm-bar{position:relative;flex:1;height:12px;border-radius:99px;background:rgba(255,255,255,.2)}
.charm-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#E83A74,#FFB62E);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.charm-mark{position:absolute;top:-5px;bottom:-5px;width:3px;margin-left:-1px;border-radius:2px;background:#fff}
.charm-num{font-weight:900;min-width:2ch;text-align:right;font-variant-numeric:tabular-nums}
.charm-cap{position:absolute;top:56px;right:var(--gr);font-size:12px;font-weight:800;color:#fff;background:var(--scrim);padding:3px 9px;border-radius:99px}
.nametag{position:absolute;top:58px;left:var(--gl);background:var(--scrim);color:#fff;padding:6px 12px;border-radius:12px;font-weight:800;line-height:1.2}
.nametag small{display:block;font-weight:600;font-size:12px;opacity:.85}
.pop{position:absolute;left:50%;top:60px;font-size:28px;font-weight:900;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.6);animation:floatUp 1s ease-out forwards;pointer-events:none}
.pop.up{color:#7CF2D4}
.pop.down{color:#FF9A8E}
.hb{position:absolute;width:22px;height:22px;color:#FF5C93;animation:burst .95s ease-out forwards;pointer-events:none}
.hb .ic{width:100%;height:100%}
.dlg{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-block:14px 14px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
.dock{flex:none;display:flex;gap:10px;padding-block:10px 12px;margin-left:calc(var(--gl)*-1);margin-right:calc(var(--gr)*-1);padding-left:var(--gl);padding-right:var(--gr);background:var(--bg);border-top:1px solid var(--line)}
.dock:empty{display:none}

.bubble{position:relative;padding:12px 14px;border-radius:18px;background:var(--panel);border:1px solid var(--line);animation:rise .3s ease both}
.bubble.her{border-top-left-radius:6px}
.bubble.you{margin-left:auto;max-width:94%;background:var(--panel2);border-top-right-radius:6px}
.bubble.narr{background:transparent;border:1px dashed var(--line);color:var(--ink2);font-style:italic}
.bubble.react{border-left:4px solid var(--rose)}
.b-name{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin-bottom:2px}
.bubble .es{font-size:21px;line-height:1.3;font-weight:700}
.bubble .en{margin-top:4px;color:var(--ink2);font-size:15px}
.b-tools{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.sp{min-height:44px;min-width:44px;padding:0 12px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:14px}
.sp.done{background:var(--good-bg);border-color:var(--teal)}
.listen-btn{width:100%;min-height:64px;border-radius:16px;background:var(--panel2);border:2px dashed var(--gold);display:flex;align-items:center;justify-content:center;gap:10px;font-weight:800;font-size:18px}
.listen-btn .ic{width:28px;height:28px;color:var(--gold)}
.ask{font-weight:700;font-size:17px;padding:0 4px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;min-height:60px;padding:12px 14px;border-radius:16px;background:var(--panel);border:2px solid var(--line);display:flex;flex-direction:column;gap:2px;transition:transform .12s,border-color .12s}
.opt:active:not([disabled]){transform:scale(.985)}
.opt .o-es{font-weight:700;font-size:18px;line-height:1.3}
.opt .o-en{color:var(--ink2);font-size:14px}
.opt.good{border-color:var(--teal);background:var(--good-bg)}
.opt.ok{border-color:var(--warn);background:var(--ok-bg)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.best{border-color:var(--teal);border-style:dashed}
.opt.dim{opacity:.55}
.fb{border-radius:16px;padding:12px 14px;border:1px solid var(--line);background:var(--panel);animation:rise .3s ease both}
.fb.good{background:var(--good-bg);border-color:var(--teal)}
.fb.ok,.fb.warn{background:var(--ok-bg);border-color:var(--warn)}
.fb.bad{background:var(--bad-bg);border-color:var(--bad)}
.fb-h{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px}
.fb-h .d{margin-left:auto;font-variant-numeric:tabular-nums}
.fb p{margin-top:6px}
.fb .better{margin-top:8px;font-weight:700}
.fb .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

.slots{min-height:76px;display:flex;flex-wrap:wrap;gap:8px;padding:12px;border-radius:16px;border:2px dashed var(--line);background:var(--bg2);align-content:flex-start}
.slots-hint{color:var(--ink2);align-self:center}
.slots.right{border-color:var(--teal);border-style:solid;background:var(--good-bg)}
.slots.wrong{animation:shake .4s}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tile{min-height:50px;padding:0 16px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);font-weight:700;font-size:18px;box-shadow:0 3px 0 var(--line)}
.tile.placed{background:var(--gold);color:var(--gold-ink);border-color:transparent}
.tile[disabled]{opacity:.8}

/* result */
.res-art{position:relative;height:170px;overflow:hidden;border-radius:22px}
.res-art .bd,.res-art .bd svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.res-art .her-mini{position:absolute;left:50%;transform:translateX(-50%);bottom:0;height:158px}
.res-art .her-mini svg{height:100%;width:auto;display:block}
.res-title{font-family:var(--font-display);font-weight:400;font-size:34px;line-height:1.1;text-align:center;text-wrap:balance}
.hearts{display:flex;justify-content:center;gap:10px;margin:6px 0}
.hearts .h{font-size:54px;color:var(--ink2);opacity:.4;display:inline-flex}
.hearts .h.on{color:var(--rose);opacity:1;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both;animation-delay:var(--d,0ms)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{padding:10px 6px;border-radius:14px;background:var(--panel);border:1px solid var(--line);text-align:center}
.stat b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--ink2);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.misslist{display:flex;flex-direction:column;gap:8px}
.miss{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
.miss div{flex:1;min-width:0}
.miss b{display:block;font-size:17px}
.miss span{font-size:14px;color:var(--ink2)}
.banner{padding:14px;border-radius:16px;background:linear-gradient(135deg,var(--rose),#9B2FD1);color:#fff;font-weight:800;text-align:center}

/* practice */
.qtop{display:flex;align-items:center;gap:12px;padding-block:12px 4px}
.qbar{flex:1;height:10px;border-radius:99px;background:var(--panel);overflow:hidden}
.qbar i{display:block;height:100%;background:linear-gradient(90deg,var(--rose),var(--gold));border-radius:99px;transition:width .3s}
.qcard{padding:22px 16px;border-radius:22px;background:var(--panel);border:1px solid var(--line);text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.qcard .t{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.qcard .big{font-family:var(--font-display);font-size:30px;line-height:1.15;text-wrap:balance}

function bdVA(id) {

  s += pth('M30 200 L96 200 L88 212 L38 212Z', '#221a3a') + rect(60, 168, 2, 32, '#221a3a') + circ(61, 172, 2, '#ffd479') + poly('62,172 84,198 62,198', '#2f2552') + pth('M120 204 L160 204 L156 214 L124 214Z', '#1b1430') + rect(138, 184, 2, 20, '#1b1430') + circ(139, 187, 1.8, '#ff6b6b');

  const pastel = ['#f78fb3', '#f7d794', '#63cdda', '#cf6a87', '#a29bfe', '#f19066', '#7bed9f', '#ffeaa7'];
  for (let x = 150; x < 396; x += 20) {
    const base = 232 - (x - 130) * (160 / 270);
    for (let k = 0; k < 4; k++) {
      const hx = x + r() * 6, hy = base + k * 20 - 8; if (hy > 252) continue;
      const c = pastel[Math.floor(r() * pastel.length)];
      s += rect(hx.toFixed(0), hy.toFixed(0), 18, 15, c) + poly((hx - 1).toFixed(0) + ',' + hy.toFixed(0) + ' ' + (hx + 9).toFixed(0) + ',' + (hy - 8).toFixed(0) + ' ' + (hx + 19).toFixed(0) + ',' + hy.toFixed(0), shade(c, -0.3)) +
           rect((hx + 6).toFixed(0), (hy + 4).toFixed(0), 5, 7, '#241636') + (r() > 0.35 ? grp('fl', rect((hx + 6).toFixed(0), (hy + 4).toFixed(0), 5, 7, '#ffd479'), 'animation-delay:' + (-r() * 6).toFixed(1) + 's') : '');
    }
  }
  s += '<path d="M158 236 L338 126" stroke="#1a1326" stroke-width="3" fill="none"/>' + grp('funi', '<g transform="rotate(-31 0 0)">' + rect(-14, -9, 28, 16, '#e63946', 'rx="3"') + rect(-10, -6, 8, 7, '#bfe9ff') + rect(2, -6, 8, 7, '#bfe9ff') + '</g>', 'transform:translate(170px,229px)');
  s += grp('dr', '<ellipse cx="80" cy="190" rx="90" ry="8" fill="#9fb0e0" opacity=".14"/><ellipse cx="260" cy="200" rx="110" ry="9" fill="#9fb0e0" opacity=".12"/>', 'animation-duration:90s');
  return svgWrap(s + vignette(id));
}

function bdBT(id) {
  const r = rng(61);
  let s = skyDef(id, [[0, '#ffd9a0'], [0.6, '#ff9a8b'], [1, '#c96ba5']]);
  s += glow(id, 330, 60, 90, '#fff3c4', 0.8);

  s += bunting(16, 28, ['#ff4d8d', '#ffd23f', '#3ddc97', '#4cc9f0', '#ff8c42'], true);
  s += '<ellipse cx="350" cy="196" rx="30" ry="8" fill="#000" opacity=".15"/>' + pth('M336 196 L342 164 L358 164 L364 196Z', '#c0603a') + pth('M350 164 C330 140 326 112 342 100 C346 120 352 140 350 164 C352 140 366 118 374 104 C382 124 370 150 350 164Z', '#2f8f4a');
  for (let k = 0; k < 20; k++) s += grp('tw', circ((r() * 400).toFixed(0), (r() * 190).toFixed(0), 1.4, '#fff4c8'), 'animation-delay:' + (-r() * 4).toFixed(1) + 's');
  return svgWrap(s + vignette(id));
}

const V = (id, es, en, pron, note, tts) => ({ id: id, es: es, en: en, pron: pron, note: note, tts: tts || '' });

const HER = (es, en, mood) => ({ t: 'say', who: 'her', es: es, en: en, mood: mood || 'smile' });
const YOU = (es, en) => ({ t: 'say', who: 'you', es: es, en: en });

const CH = (es, en, opts, o) => { o = o || {}; return { t: 'choice', her: { es: es, en: en, mood: o.mood || 'smile' }, opts: opts, hidden: !!o.hidden, ask: o.ask || '', v: o.v || [] }; };
const BU = (prompt, ans, extra, r, v) => ({ t: 'build', prompt: prompt, ans: ans, extra: extra, react: r ? { es: r[0], en: r[1], mood: r[2] || 'smile' } : null, v: v || [] });

const Fx = (function () {

  const KINDS = { mx: ['#ffb62e', '#ff7a3d', '#ffd23f'], co: ['#fff3c4', '#ffd98a'], md: ['#d7ff8a', '#fff'], li: ['#ffe08a', '#ffd0c4'], ba: ['#ffd479', '#ff9a5c'], va: ['#fff', '#cfd8ff'], boot: ['#ff4d8d', '#ffd23f', '#3ddc97', '#4cc9f0'], hearts: ['#ff5c93', '#ff8fb5', '#ffd0e0'] };
  function spawn(w, h, fresh) {
    const cols = KINDS[kind] || KINDS.co;
    const heart = kind === 'hearts';
    return { x: Math.random() * w, y: fresh ? (heart ? h + 10 : -10) : Math.random() * h, vx: (Math.random() - 0.5) * 12, vy: heart ? -(18 + Math.random() * 26) : (kind === 'md' || kind === 'ba' || kind === 'co' || kind === 'li') ? -(4 + Math.random() * 10) : (10 + Math.random() * 26),
      s: 1.5 + Math.random() * (heart ? 5 : 2), c: cols[Math.floor(Math.random() * cols.length)], ph: Math.random() * 6.28, a: 0.25 + Math.random() * 0.4 };
  }
  function frame(t) {
    if (!cv) return;
    const dt = Math.min(0.05, (t - last) / 1000 || 0.016); last = t;
    const w = cv.width, h = cv.height;
    ctx2.clearRect(0, 0, w, h);
    parts.forEach(function (p, i) {
      p.ph += dt * 2; p.x += (p.vx + Math.sin(p.ph) * 10) * dt; p.y += p.vy * dt;
      if (p.y < -14 || p.y > h + 14) parts[i] = spawn(w, h, true);
      ctx2.globalAlpha = p.a * (kind === 'md' || kind === 'ba' ? 0.5 + 0.5 * Math.sin(p.ph * 2) : 1);
      ctx2.fillStyle = p.c;
      if (kind === 'hearts') { const s = p.s; ctx2.beginPath(); ctx2.moveTo(p.x, p.y + s * 0.4); ctx2.bezierCurveTo(p.x - s, p.y - s * 0.6, p.x - s * 1.2, p.y + s * 0.8, p.x, p.y + s * 1.5); ctx2.bezierCurveTo(p.x + s * 1.2, p.y + s * 0.8, p.x + s, p.y - s * 0.6, p.x, p.y + s * 0.4); ctx2.fill(); }
      else if (kind === 'mx') { ctx2.save(); ctx2.translate(p.x, p.y); ctx2.rotate(p.ph); ctx2.beginPath(); ctx2.ellipse(0, 0, p.s * 1.4, p.s * 0.7, 0, 0, 6.28); ctx2.fill(); ctx2.restore(); }
      else { ctx2.beginPath(); ctx2.arc(p.x, p.y, p.s * 0.6, 0, 6.28); ctx2.fill(); }
    });
    raf = requestAnimationFrame(frame);
  }
  return {
    start: function (stage, k, n) {
      this.stop();
      if (!stage || reduceMotion()) return;
      kind = k; cv = document.createElement('canvas'); cv.className = 'fx';
      const r = stage.getBoundingClientRect(); cv.width = Math.max(200, Math.round(r.width / 1.5)); cv.height = Math.max(120, Math.round(r.height / 1.5));
      stage.appendChild(cv); ctx2 = cv.getContext('2d'); parts = []; for (let i = 0; i < (n || 26); i++) parts.push(spawn(cv.width, cv.height, false));

    stop: function () { cancelAnimationFrame(raf); raf = 0; if (cv && cv.parentNode) cv.parentNode.removeChild(cv); cv = null; }
  };
})();

function updateCharm(d) {

function heartBurst() {

function award(q, v, spoken) {

  run.xp += q === 2 ? 12 : q === 1 ? 6 : q === 0 ? 1 : 0;
  if (q <= 0) (v || []).forEach(id => { if (run.missV.indexOf(id) < 0) run.missV.push(id); });
  updateCharm(d);
  Aud.sfx(q === 2 ? 'great' : q === 1 ? 'ok' : q === 0 ? 'bad' : 'rude');
  if (q === 2) heartBurst();

}
function bubbleHTML(who, es, en, o) {

function doPick(idx, spoken) {

  run.answered = true;
  const b = run.beats[run.i], o = b.opts[idx], best = b.opts.find(x => x.q === 2);
  let q = o.q, capped = false;

  $$('#opts .opt').forEach(btn => {
    btn.disabled = true; const oo = b.opts[+btn.dataset.i];
    if (+btn.dataset.i === idx) btn.classList.add(oo.q >= 2 ? 'good' : oo.q === 1 ? 'ok' : 'bad'); else if (oo.q === 2) btn.classList.add('best'); else btn.classList.add('dim');
  });
  const d = award(q, b.v);
  if (spoken && q >= 1) { run.xp += 3; run.spoken++; }
  if (q <= 0) run.miss.push({ es: subst(best.es), en: subst(best.en) });
  const label = q === 2 ? (spoken ? 'Perfect, and you said it!' : 'Perfect!') : q === 1 ? (capped ? 'Good, but you peeked' : 'Not bad') : q === 0 ? 'Not quite' : 'Ouch!';
  const cls = q === 2 ? 'good' : q === 1 ? 'ok' : 'bad';

/* build-the-sentence beats */
function showBuild(b) {
  const words = b.ans.split(/\s+/).map(w => w.replace(/[¿?¡!.,;:]/g, ''));
  const labels = words.map((w, i) => i === 0 ? w.charAt(0).toLowerCase() + w.slice(1) : w).concat(b.extra);
  bs = { b: b, labels: labels, want: words.map(w => w.toLowerCase()), order: shuffle(labels.map((_, i) => i)), placed: [] };
  setMood('smile');
  $('#panel').innerHTML = '<p class="ask">' + esc(b.prompt) + '</p><div class="slots" id="slots"></div><div class="bank" id="bank"></div><div id="after"></div>';
  $('#dock').innerHTML = '<button class="btn ghost" data-act="bclear">Clear</button><button class="btn primary" id="chk" data-act="bcheck" disabled>Check</button>';
  renderBuild(); Aud.preload(b.ans, 'm1');
}
function renderBuild() {
  const slots = $('#slots'), bank = $('#bank'), chk = $('#chk'); if (!slots || !bs) return;
  slots.innerHTML = bs.placed.length ? bs.placed.map(i => '<button class="tile placed" data-act="bunplace" data-i="' + i + '">' + esc(bs.labels[i]) + '</button>').join('') : '<span class="slots-hint">Tap the words in order</span>';
  bank.innerHTML = bs.order.filter(i => bs.placed.indexOf(i) < 0).map(i => '<button class="tile" data-act="bplace" data-i="' + i + '">' + esc(bs.labels[i]) + '</button>').join('');
  if (chk) chk.disabled = bs.placed.length === 0;
}
ACT.bplace = function (el) { if (run.answered) return; bs.placed.push(+el.dataset.i); Aud.sfx('tile'); renderBuild(); };
ACT.bunplace = function (el) { if (run.answered) return; bs.placed = bs.placed.filter(i => i !== +el.dataset.i); Aud.sfx('tile'); renderBuild(); };
ACT.bclear = function () { if (run.answered) return; bs.placed = []; renderBuild(); };
ACT.bcheck = function () {
  if (run.answered || !bs.placed.length) return;
  const got = bs.placed.map(i => bs.labels[i].toLowerCase()).join(' ');
  if (got === bs.want.join(' ')) { finishBuild(run.tries === 0 ? 2 : 1, true); return; }
  run.tries++;
  const slots = $('#slots'); slots.classList.remove('wrong'); void slots.offsetWidth; slots.classList.add('wrong'); Aud.sfx('bad');
  if (run.tries >= 2) { finishBuild(0, false); return; }
  $('#after').innerHTML = '<div class="fb warn"><div class="fb-h">' + ic('x') + '<span>Not yet</span></div><p>Hint: the sentence starts with “' + esc(bs.want[0]) + '”. Tap a word to take it back out.</p></div>'; scrollPanel();
};
function finishBuild(q, ok) {
  const b = bs.b; run.answered = true;
  if (!ok) { const used = []; bs.placed = bs.want.map(w => { const idx = bs.labels.findIndex((l, k) => l.toLowerCase() === w && used.indexOf(k) < 0); used.push(idx); return idx; }); }
  renderBuild(); $$('#slots .tile').forEach(t => { t.disabled = true; }); $('#slots').classList.add(ok ? 'right' : 'wrong'); $('#bank').hidden = true;
  const d = award(q, b.v);
  if (q === 0) run.miss.push({ es: b.ans, en: englishOf(b.prompt) });
  let fb = '<div class="fb ' + (q === 2 ? 'good' : q === 1 ? 'ok' : 'bad') + '"><div class="fb-h">' + ic(q >= 1 ? 'check' : 'x') + '<span>' + (q === 2 ? 'Perfect!' : q === 1 ? 'Got it on the second try' : 'The answer was:') + '</span><span class="d">' + (d >= 0 ? '+' : '') + Math.round(d) + ' charm</span></div><p class="better">' + esc(b.ans) + '</p>' + sayItRow(b.ans) + '</div>';
  if (b.react) fb += bubbleHTML('her', b.react.es, b.react.en, { cls: 'react' });
  $('#after').innerHTML = fb; setMood(b.react ? b.react.mood : 'smile');
  $('#dock').innerHTML = '<button class="btn primary" data-act="next">Continue</button>';
  say(b.ans, { who: 'you' }); if (b.react) say(b.react.es, { who: 'her', queue: true });
  scrollPanel();
}

/* shared scene actions */
ACT.say = function (el) { say(el.dataset.t, { who: el.dataset.who || 'her', slow: el.dataset.slow === '1' }); };
ACT.peek = function (el) { const bub = el.closest('.bubble'), en = bub && $('.en', bub); if (en && en.hidden) { en.hidden = false; if (run) run.peeks++; } el.remove(); };
ACT.reveal = function (el) { const rv = $('#revealed'); if (rv && rv.hidden) { rv.hidden = false; run.revealed = true; run.peeks++; } el.remove(); };
ACT.next = function () { Aud.stop(); run.i++; showBeat(); };
ACT.leave = function () { Aud.stop(); mapScreen(); };
function endPhase() {
  if (run.phase === 'main') {
    run.charm = Math.round(run.charm * 10) / 10;
    run.hearts = run.charm >= 90 ? 3 : run.charm >= 75 ? 2 : run.charm >= 55 ? 1 : 0;
    run.phase = 'end'; run.beats = run.hearts >= 1 ? run.ep.win : run.ep.lose; run.i = 0; showBeat(); return;
  }
  result();
}

/* ---------- RESULT ---------- */
function result() {
  Aud.stop();
  const ep = run.ep, idx = EPS.indexOf(ep), prev = S.eps[ep.id] || { hearts: 0, best: 0, plays: 0 }, win = run.hearts >= 1;
  let xp = run.xp + run.hearts * 20 + (prev.plays === 0 ? 25 : 0);
  const noPeek = !S.settings.helper && run.peeks === 0; if (noPeek) xp = Math.round(xp * 1.5);
  const nextEp = EPS[idx + 1], wasOpen = nextEp ? unlocked(idx + 1) : false;
  S.eps[ep.id] = { hearts: Math.max(prev.hearts, run.hearts), best: Math.max(prev.best, Math.round(run.charm)), plays: prev.plays + 1 };
  ep.vocab.forEach(v => srsAdd(v.id)); run.missV.forEach(id => srsGrade(id, false)); gain(xp);
  const unlockedNow = !!(nextEp && !wasOpen && unlocked(idx + 1)), season = EPS.every(e => ((S.eps[e.id] || {}).hearts || 0) >= 1);
  const hearts = [1, 2, 3].map(n => '<span class="h' + (n <= run.hearts ? ' on' : '') + '" style="--d:' + (n * 160) + 'ms">' + ic('heart', true) + '</span>').join('');
  const miss = run.miss.slice(0, 6).map(m => '<div class="miss"><div><b>' + esc(m.es) + '</b><span>' + esc(m.en) + '</span></div><button class="sp" data-act="say" data-who="you" data-t="' + esc(m.es) + '" aria-label="Listen">' + ic('speaker') + '</button></div>').join('');
  const btns = [];
  if (win && nextEp) btns.push('<button class="btn primary" data-act="play" data-id="' + nextEp.id + '">Chapter ' + nextEp.n + ': ' + esc(nextEp.town) + '</button>');
  btns.push('<button class="btn' + (win && nextEp ? '' : ' primary') + '" data-act="retry" data-id="' + ep.id + '">' + (win ? 'Improve my score' : 'Try again') + '</button>');
  btns.push('<button class="btn ghost" data-act="go" data-to="map">Back to the map</button>');
  view('result',
    '<div class="scroll" style="padding-top:12px"><div class="res-art"><div class="bd">' + backdrop(ep.id, 'r' + ep.id) + '</div><div class="her-mini">' + portrait(herLook(ep), win ? 'blush' : 'neutral') + '</div></div>' +
    '<div class="stack" style="margin-top:16px"><h2 class="res-title">' + (win ? 'She said yes!' : 'Not yet…') + '</h2><div class="hearts" aria-label="' + run.hearts + ' of 3 hearts">' + hearts + '</div>' +
      '<p class="lead" style="text-align:center">' + (win ? esc(ep.her.name) + ' agreed to a date. ' + (run.hearts === 3 ? 'Flawless charm!' : 'Replay for all three hearts.') : 'You need 55 charm for a date. You reached ' + Math.round(run.charm) + '.') + '</p>' +
      '<div class="stats"><div class="stat"><b>' + Math.round(run.charm) + '</b><span>Charm</span></div><div class="stat"><b>+' + xp + '</b><span>XP</span></div><div class="stat"><b>' + run.spoken + '</b><span>Spoken</span></div></div>' +
      (noPeek ? '<p class="fine" style="text-align:center">Bonus ×1.5 XP for playing without the English helper.</p>' : '') +
      (unlockedNow ? '<div class="banner">New chapter unlocked: ' + esc(nextEp.town) + '</div>' : '') + (season ? '<div class="banner">Season 1 complete! You are a true galán.</div>' : '') +
      (miss ? '<div><h3 class="h-sec" style="font-size:22px">Review these</h3><div class="misslist">' + miss + '</div><p class="fine" style="margin-top:8px">These are saved to your review deck.</p></div>' : '') +
      '<div class="stack" style="margin-top:6px">' + btns.join('') + '</div></div></div>', 'result');
  Aud.play(win ? 'va' : 'menu'); Aud.sfx(win ? 'win' : 'lose'); if (unlockedNow) setTimeout(() => Aud.sfx('unlock'), 900);
  if (win) Fx.start($('.res-art'), 'hearts', 18);
}

/* ---------- PRACTICE ---------- */
let quiz = null;
function practiceHome() {
  Aud.play('boot');
  const known = knownIds(), due = dueIds();
  const body = !known.length
    ? '<div class="empty"><p><b>Your review deck is empty.</b></p><p>Study the flashcards in Boot Camp or a chapter first. Every phrase you meet is saved here for practice.</p></div><button class="btn gold" style="width:100%;margin-top:14px" data-act="go" data-to="map">Go to the map</button>'
    : '<div class="qcard"><span class="t">Review deck</span><div class="bigstat">' + due.length + '</div><p>' + (due.length === 1 ? 'phrase is' : 'phrases are') + ' due today</p><p class="fine">' + known.length + ' phrases in your deck</p></div><button class="btn primary" style="width:100%;margin-top:14px" data-act="quiz">' + (due.length ? 'Start practice' : 'Practice anyway') + '</button>';
  view('practice', hdr('Practice', 'Quick reviews keep phrases in your head') + '<div class="scroll">' + body + '</div>' + nav('practice'), 'practice');
}
function makeQ(id) {
  const v = VOC[id], pool = Mic.supported() ? ['es2en', 'en2es', 'listen', 'say'] : ['es2en', 'en2es', 'listen'], t = pool[Math.floor(Math.random() * pool.length)];
  if (t === 'say') return { id: id, t: t, ans: v.es, opts: [] };
  const ans = t === 'en2es' ? v.es : v.en, wrongs = [], seen = [ans];
  shuffle(Object.keys(VOC)).forEach(k => { if (wrongs.length >= 3 || k === id) return; const a = t === 'en2es' ? VOC[k].es : VOC[k].en; if (seen.indexOf(a) < 0) { seen.push(a); wrongs.push(a); } });
  return { id: id, t: t, ans: ans, opts: shuffle([ans].concat(wrongs)) };
}
ACT.quiz = function () {
  let ids = shuffle(dueIds());
  if (ids.length < 8) ids = ids.concat(shuffle(knownIds().filter(id => ids.indexOf(id) < 0)).slice(0, 8 - ids.length));
  ids = ids.slice(0, 10); if (!ids.length) return;
  quiz = { qs: ids.map(makeQ), i: 0, right: 0, xp: 0, locked: false }; showQ();
};
function showQ() {
  const q = quiz.qs[quiz.i], v = VOC[q.id], n = quiz.qs.length, tt = v.tts || cleanTarget(v.es);
  quiz.locked = false;
  let prompt;
  if (q.t === 'es2en') prompt = '<span class="t">What does it mean?</span><div class="big">' + esc(v.es) + '</div><p class="fc-pron">Say it like: ' + esc(v.pron) + '</p><div class="fc-tools">' + spkBtns(tt, 'teach') + '</div>';
  else if (q.t === 'en2es') prompt = '<span class="t">Pick the Spanish</span><div class="big">' + esc(v.en) + '</div>';
  else if (q.t === 'say') prompt = '<span class="t">Say it in Spanish</span><div class="big">' + esc(v.en) + '</div><p class="fine">Out loud, using your microphone.</p>';
  else prompt = '<span class="t">Listen, then pick the meaning</span><button class="listen-btn" style="width:100%" data-act="say" data-who="teach" data-t="' + esc(tt) + '">' + ic('speaker') + ' Play</button>';
  view('practice', '<div class="qtop"><button class="icon-btn" style="background:var(--panel);color:var(--ink)" data-act="go" data-to="practice" aria-label="Quit">' + ic('x') + '</button><div class="qbar"><i style="width:' + Math.round(quiz.i / n * 100) + '%"></i></div><b>' + (quiz.i + 1) + '/' + n + '</b></div>' +
    '<div class="scroll"><div class="stack"><div class="qcard"><div class="coach" id="coach">' + portrait(herLook(BOOT), 'smile', '40 30 120 130') + '</div>' + prompt + '</div>' +
    (q.t === 'say' ? '<button class="btn primary" data-act="qspeak">' + ic('mic') + ' Speak</button><button class="btn ghost" data-act="qskip">Skip</button>' : '<div class="opts" id="opts">' + q.opts.map((o, i) => '<button class="opt" data-act="qpick" data-i="' + i + '"><span class="o-es">' + esc(o) + '</span></button>').join('') + '</div>') +
    '<div id="after"></div></div></div><div class="dock" id="dock"></div>', 'practice');
  if (q.t === 'es2en' || q.t === 'listen') speakLater(tt, { who: 'teach' });
}
function qResult(ok, q) {
  const v = VOC[q.id]; quiz.locked = true; srsGrade(q.id, ok); Aud.sfx(ok ? 'good' : 'bad');
  if (ok) { quiz.right++; quiz.xp += 4; }
  $('#after').innerHTML = '<div class="fb ' + (ok ? 'good' : 'bad') + '"><div class="fb-h">' + ic(ok ? 'check' : 'x') + '<span>' + (ok ? 'Correct!' : 'Not quite') + '</span></div><p><b>' + esc(v.es) + '</b> = ' + esc(v.en) + '</p><p class="fine">' + esc(v.note) + '</p></div>';
  $('#dock').innerHTML = '<button class="btn primary" data-act="qnext">' + (quiz.i + 1 >= quiz.qs.length ? 'Finish' : 'Next') + '</button>';
}
ACT.qpick = function (el) {
  if (!quiz || quiz.locked) return;
  const q = quiz.qs[quiz.i], ok = q.opts[+el.dataset.i] === q.ans;
  $$('#opts .opt').forEach((b, i) => { b.disabled = true; if (q.opts[i] === q.ans) b.classList.add('good'); else if (b === el) b.classList.add('bad'); else b.classList.add('dim'); });
  qResult(ok, q); if (q.t === 'en2es') say(VOC[q.id].tts || cleanTarget(VOC[q.id].es), { who: 'teach' });
};
ACT.qspeak = function () {
  const q = quiz.qs[quiz.i], v = VOC[q.id];
  openMic({ mode: 'say', target: v.tts ? v.tts.replace(/,/g, '') : cleanTarget(v.es).replace(/,/g, ''), say: v.tts || cleanTarget(v.es), en: v.en, pron: v.pron, onResult: function (sc, fresh) { if (fresh && !quiz.locked) qResult(sc.score >= 0.65, q); } });
};
ACT.qskip = function () { if (quiz.locked) return; qResult(false, quiz.qs[quiz.i]); };
ACT.qnext = function () { quiz.i++; if (quiz.i >= quiz.qs.length) quizEnd(); else showQ(); };
function quizEnd() {
  Aud.stop();
  const n = quiz.qs.length, bonus = quiz.right === n ? 10 : 0, xp = quiz.xp + bonus; gain(xp);
  view('practice', hdr('All done!', 'Practice complete') + '<div class="scroll"><div class="stack"><div class="qcard"><span class="t">Your score</span><div class="bigstat">' + quiz.right + '/' + n + '</div><p>+' + xp + ' XP' + (bonus ? ' (perfect bonus)' : '') + '</p><p class="fine">Daily streak: ' + streakNow() + '</p></div>' +
    '<button class="btn primary" data-act="quiz">Practice again</button><button class="btn ghost" data-act="go" data-to="map">Back to the map</button></div></div>' + nav('practice'), 'practice');
  Aud.sfx(quiz.right >= n / 2 ? 'win' : 'ok');
}

/* ---------- SETTINGS ---------- */
let installEvt = null;
window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); installEvt = e; });
function settingsScreen() {
  Aud.play('menu');
  const st = S.settings;
  const row = (k, t, d) => '<div class="setrow"><div><b>' + t + '</b><span>' + d + '</span></div><button class="switch' + (st[k] ? ' on' : '') + '" role="switch" aria-checked="' + !!st[k] + '" aria-label="' + t + '" data-act="tog" data-k="' + k + '"></button></div>';
  const vol = (k, t) => '<div class="setrow vol"><div><b>' + t + '</b></div><input type="range" min="0" max="1" step="0.05" value="' + st[k] + '" data-vol="' + k + '" aria-label="' + t + '"></div>';
  view('settings', hdr('Settings', 'Sound, speaking and difficulty') + '<div class="scroll">' +
    row('helper', 'English helper', 'Show English under Spanish lines and choices. Turn it off for a harder game and 1.5× XP.') +
    row('music', 'Music', 'Background music for each town.') + vol('musicVol', 'Music volume') +
    row('sfx', 'Sound effects', 'Taps, chimes and cheers.') + vol('sfxVol', 'Effects volume') +
    row('sound', 'Voices', 'Hear the characters speak.') + vol('voiceVol', 'Voice volume') +
    row('slow', 'Slow speech', 'Speak slowly by default.') +
    '<div class="setrow"><div><b>Voice</b><span>' + esc(Aud.hasIndex() ? 'Recorded neural voices' : 'Phone voice: ' + Aud.voiceInfo()) + '</span></div><button class="btn sm" data-act="vtest">Test</button></div>' +
    '<div class="setrow"><div><b>Microphone accent</b><span>What the game listens for. Try Mexico first.</span></div><select id="micLang" class="sel"><option value="es-MX"' + (st.micLang === 'es-MX' ? ' selected' : '') + '>Mexico</option><option value="es-US"' + (st.micLang === 'es-US' ? ' selected' : '') + '>United States</option><option value="es-ES"' + (st.micLang === 'es-ES' ? ' selected' : '') + '>Spain</option><option value="es-AR"' + (st.micLang === 'es-AR' ? ' selected' : '') + '>Argentina</option></select></div>' +
    '<div class="setrow"><div><b>Test microphone</b><span>Say “hola” to check that the game can hear you.</span></div><button class="btn sm" data-act="mictest">Test</button></div>' +
    (installEvt ? '<div class="setrow"><div><b>Install app</b><span>Add the game to your home screen.</span></div><button class="btn sm gold" data-act="install">Install</button></div>' : '') +
    '<div class="setrow"><div><b>Reset progress</b><span>Erase hearts, XP and the review deck on this device.</span></div><button class="btn sm" data-act="reset">Reset</button></div>' +
    '<p class="fine" style="margin-top:14px">Progress is saved on this device. Galán de Telenovela v2.0</p></div>' + nav('settings'), 'settings');
}
ACT.tog = function (el) {
  const k = el.dataset.k; S.settings[k] = !S.settings[k]; el.classList.toggle('on', S.settings[k]); el.setAttribute('aria-checked', String(S.settings[k])); save();
  if (k === 'music') { Aud.unlock(); Aud.refresh(); } else Aud.apply();
};
ACT.vtest = function () { say('Hola, me llamo ' + (S.hero.name || 'Galán') + '. Mucho gusto.', { who: 'you' }); };
ACT.mictest = function () { openMic({ mode: 'say', target: 'Hola', en: 'Hello', title: 'Microphone test', onResult: function () { /* no reward */ } }); };
ACT.install = function () { if (installEvt) { installEvt.prompt(); installEvt = null; } };
ACT.reset = function (el) {
  if (el.dataset.armed) { S = blank(); save(); splash(); return; }
  el.dataset.armed = '1'; el.textContent = 'Tap again';
  setTimeout(() => { if (el.isConnected) { delete el.dataset.armed; el.textContent = 'Reset'; } }, 4000);
};

/* ---------- BOOT ---------- */
document.addEventListener('click', function (e) {
  Aud.unlock();
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act];
  const quiet = { pick: 1, bplace: 1, bunplace: 1, micgo: 1, micsubmit: 1, say: 1, sayit: 1, next: 0 };
  if (!quiet[el.dataset.act]) Aud.sfx('click');
  if (fn) fn(el, e);
});
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) { window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () { /* optional */ }); }); }
splash();
window.__galan = { EPS: EPS, BOOT: BOOT, FROM: FROM_OPTIONS, voiceKey: voiceKey, cleanTarget: cleanTarget, S: function () { return S; }, run: function () { return run; } };

})();
</script>
